<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Réservation - Sunset Lounge Island</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #e0f7fa, #fff);
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background-color: #D2B48C; /* Couleur sable clair */
      color: white;
      padding: 20px;
      text-align: center;
    }

    header img {
      max-width: 150px;
      margin-bottom: 10px;
    }

    .container {
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }

    h2 {
      color: #D2B48C; /* Couleur sable clair */
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-top: 10px;
    }

    input, textarea, select, button {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #D2B48C; /* Couleur sable clair */
      color: white;
      cursor: pointer;
      margin-top: 20px;
    }

    .whatsapp-btn {
      display: inline-block;
      padding: 12px 20px;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      margin-top: 30px;
      text-align: center;
    }

    footer {
      background-color: #A67B5B; /* Couleur sable foncé */
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 30px;
    }

    a {
      color: #D2B48C; /* Couleur sable clair */
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i.postimg.cc/cKRh2BHD/IMG-1585.jpg" alt="Logo Sunset Lounge Island">
    <h1>Sunset Lounge Island</h1>
    <p>Location d'îlots flottants à Sainte-Anne & Bois Jolan</p>
  </header>

  <div class="container">
    <h2>Réserve ton îlot flottant 🦦</h2>
    <p><strong>Horaires :</strong> Tous les jours de 9h à 18h ☀️ | Samedi de 21h à 23h 😏</p>
    <p><strong>Tarif :</strong> 85€ la demi-journée</p>

    <form>
      <label for="name">Prénom & Nom</label>
      <input type="text" id="name" name="name" required>

      <label for="phone">Téléphone / WhatsApp</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="date">Date souhaitée</label>
      <input type="date" id="date" name="date" required>

      <label for="time">Heure souhaitée</label>
      <input type="time" id="time" name="time" required>

      <label for="people">Nombre de personnes</label>
      <input type="number" id="people" name="people" min="1" max="10" required>

      <label for="pack">Choisis ton pack :</label>
      <select id="pack" name="pack" required>
        <option value="">-- Sélectionne un pack --</option>
        <option value="PACK DATE PETIT-DÉJEUNER 🥐">PACK DATE PETIT-DÉJEUNER 🥐</option>
        <option value="PACK DATE PIQUE-NIQUE 🧺">PACK DATE PIQUE-NIQUE 🧺</option>
        <option value="PACK DATE PIQUE-NIQUE SUCRÉ 🍪">PACK DATE PIQUE-NIQUE SUCRÉ 🍪</option>
      </select>

      <label for="message">Message / Demande particulière</label>
      <textarea id="message" name="message" rows="4"></textarea>

      <button type="submit">Envoyer via WhatsApp</button>
    </form>

    <p style="margin-top: 30px;">📧 Contact email : 
      <a href="mailto:sunsetloungeislandfwi@gmail.com">sunsetloungeislandfwi@gmail.com</a>
    </p>
  </div>

  <footer>
    &copy; 2025 Sunset Lounge Island – Guadeloupe
  </footer>

  <!-- SCRIPT WhatsApp avec les données du formulaire -->
  <script>
    document.querySelector("form").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      const people = document.getElementById("people").value;
      const pack = document.getElementById("pack").value;
      const message = document.getElementById("message").value;

      const text = `Bonjour ! Je souhaite réserver un îlot flottant 🦦

👤 Nom : ${name}
📞 Téléphone : ${phone}
📅 Date : ${date}
⏰ Heure : ${time}
👥 Nombre de personnes : ${people}
📦 Pack choisi : ${pack}
📝 Message : ${message}`;

      const encodedText = encodeURIComponent(text);
      const whatsappURL = `https://wa.me/33745243513?text=${encodedText}`;

      window.open(whatsappURL, "_blank");
    });
  </script>

</body>
</html>
